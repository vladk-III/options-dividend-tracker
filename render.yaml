services:
  - type: web
    name: options-dividend-farm
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:server -b 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9   # pandas 2.2.2 has no prebuilt wheel for newer Pythons
      - key: GITHUB_TOKEN
        sync: false     # set this manually in the Render dashboard — never commit it
